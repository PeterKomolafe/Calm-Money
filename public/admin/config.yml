# Decap CMS: edit site content at /admin.
# Login uses GitHub via Netlify's OAuth provider (see README for one-time setup).
backend:
  name: github
  repo: PeterKomolafe/Calm-Money
  branch: main

# Changes open as drafts you can review before publishing
publish_mode: editorial_workflow

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site details
        file: src/data/site.json
        fields:
          - { name: name, label: Site name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: owner, label: Owner, widget: string }
          - { name: email, label: Contact email, widget: string }
          - { name: youtube_url, label: YouTube URL, widget: string, required: false }
          - { name: instagram_url, label: Instagram URL, widget: string, required: false }
          - { name: disclaimer, label: Regulatory disclaimer, widget: text }

  - name: testimonials
    label: Testimonials
    folder: src/content/testimonials
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { name: name, label: Name as agreed (full name, first name or initials), widget: string }
      - { name: goal, label: Goal they came in with, widget: select, options: [{ label: Get debt free, value: debt }, { label: Get financially secure, value: secure }, { label: Build wealth, value: wealth }], required: false }
      - { name: headline, label: "Headline quote (Q12: how they feel about money now)", widget: text }
      - { name: before, label: "Before joining (Q1)", widget: text, required: false }
      - { name: tipped, label: "What tipped it (Q2)", widget: text, required: false }
      - { name: doubt, label: "The doubt, and how it looks now (Q3 and Q4)", widget: text, required: false }
      - { name: doing_now, label: "Doing now (Q10)", widget: text, required: false }
      - { name: placeholder, label: Placeholder, widget: boolean, default: false }
      - { name: permission_confirmed, label: Member gave written permission, widget: boolean, default: false, hint: "Only shown on the site when ticked" }
      - { name: order, label: Display order, widget: number, default: 0 }

