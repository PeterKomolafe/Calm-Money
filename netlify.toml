[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify already redirects http to https once the certificate is issued.
# HSTS tells browsers to use https every time, even if someone types http.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The money personality test lives on its own Netlify site (built from quiz/site).
# Show it at calmmoneycommunity.com/test without changing the address bar.
[[redirects]]
  from = "/test"
  to = "https://calmmoneypersonalitytest.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/test/*"
  to = "https://calmmoneypersonalitytest.netlify.app/:splat"
  status = 200
  force = true
