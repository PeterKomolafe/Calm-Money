[build]
  # TEMPORARY: fails on purpose so linking the repo cannot publish over the live site.
  # Put back to "npm run build" once auto publishing is locked in Netlify.
  command = "echo 'Build paused until auto publishing is locked' && exit 1"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify already redirects http to https once the certificate is issued.
# HSTS tells browsers to use https every time, even if someone types http.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
